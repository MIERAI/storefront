name: ci
on: [pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:   # internal/orders tests (TEST_DATABASE_URL; skipped without it)
        image: mirror.gcr.io/library/postgres:16-alpine   # Docker Hub's official image through Google's cache (no pull limit)
        env: { POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
      - run: go vet ./... && go test -race ./...
  # catalog (services/catalog): its own Go module, generated by api-factory (scripts/factory.sh pins the commit)
  catalog:
    runs-on: ubuntu-latest
    services:
      postgres:   # the factory's acceptance: an empty scratch database
        image: mirror.gcr.io/library/postgres:16-alpine
        env: { POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # migrations-check compares with the base branch (append-only)
      - uses: actions/setup-go@v7
        with: { go-version-file: services/catalog/go.mod, cache-dependency-path: services/catalog/go.sum }
      - name: gofmt, vet, unit tests
        working-directory: services/catalog
        run: |
          test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
          go vet ./... && go test -race ./...
      - name: generated files match the designs (api-factory at the pinned commit)
        run: scripts/factory.sh services/catalog verify
      - name: migrations (append-only, schema drift against db/schema, re-run safe)
        env: { BASE: "origin/${{ github.base_ref }}" }
        run: scripts/migrations-check.sh services/catalog
      - name: the factory's acceptance (hand-written + automatic + differential cases, real server and Postgres)
        env: { ACCEPT_DATABASE_URL: "postgres://postgres:test@localhost:5432/postgres?sslmode=disable" }
        run: scripts/factory.sh services/catalog accept 2>&1 | tail -5
