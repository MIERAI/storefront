# Entry points of the perf env. Every replica of a service is a server (DNS of the compose network returns one
# address per replica; server-template keeps up when compose scales). Round robin, HTTP keep-alive to the backends.
global
    maxconn 20000
    nbthread 2

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s
    accepted_payload_size 8192

defaults
    mode http
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    timeout http-keep-alive 30s
    option http-keep-alive
    default-server init-addr none resolvers docker check inter 2s fall 2 rise 1

frontend order
    bind :18080
    default_backend order
frontend catalog
    bind :18081
    default_backend catalog
frontend inventory
    bind :18082
    default_backend inventory
frontend stats
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }

backend order
    balance roundrobin
    option httpchk GET /readyz
    server-template order 1-8 order:8080
backend catalog
    balance roundrobin
    option httpchk GET /readyz
    server-template catalog 1-8 catalog:8080
backend inventory
    balance roundrobin
    option httpchk GET /readyz
    server-template inventory 1-8 inventory:8080
