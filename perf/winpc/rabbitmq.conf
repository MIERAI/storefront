# perf env: publishers are blocked above the watermark; 1 GiB leaves room for a backlog of a breaking step
# (the container's limit is 2 GiB). The prometheus plugin (port 15692) is on in the management image.
vm_memory_high_watermark.absolute = 1GiB
disk_free_limit.absolute = 1GB
prometheus.return_per_object_metrics = true
