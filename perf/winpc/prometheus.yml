# perf env: every replica of every service (DNS of the compose network: one A record per replica), RabbitMQ,
# HAProxy, the cgroup exporter (CPU of every container and of the host). 5s: a 60s measurement window has 12 samples.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: services
    dns_sd_configs:
      - { names: [order, inventory, payment, notification, catalog], type: A, port: 9090, refresh_interval: 5s }
    relabel_configs:
      - { source_labels: [__meta_dns_name], target_label: app }
  - job_name: rabbitmq
    static_configs: [{ targets: ["rabbitmq:15692"] }]
  - job_name: haproxy
    static_configs: [{ targets: ["haproxy:8404"] }]
  - job_name: cgroups
    static_configs: [{ targets: ["cgroups:9338"] }]
