spec_version: "0.2"
api:
    rpc: payment.payment.v1.PaymentMessageHandlerService/ChargePayment
    owner: storefront
    risk_level: high
    description: saga 的扣款命令至少投递一次,超时还会重发(新 id)。订单号是幂等键,重复的扣款请求不能扣两次,而且要得到第一次的结果
pattern:
    kind: message
    not_found_message: ""
    order_by: []
    direction: ""
    page_size:
        default: 0
        max: 0
    command:
        ops:
            - name: 支付
              kind: insert_idempotent
              table: payments
              values:
                - column: order_id
                  expr: 输入.order_id
                - column: amount
                  expr: 输入.amount
                - column: status
                  expr: 如果 输入.amount > 100000 则 2 否则 1
                - column: reason
                  expr: 如果 输入.amount > 100000 则 'LIMIT_EXCEEDED' 否则 空
              conflict:
                - order_id
        receive:
            type: payment.charge
            version: 1
        results:
            - name: 成功
              when: 支付.status = 1
              emit:
                - type: payment.succeeded
                  values:
                    - column: order_id
                      expr: 支付.order_id
                    - column: amount
                      expr: 支付.amount
            - name: 成功
              emit:
                - type: payment.failed
                  values:
                    - column: order_id
                      expr: 支付.order_id
                    - column: reason
                      expr: 支付.reason
        contracts:
            - type: payment.charge
              kind: command
              version: 1
              subject: order_id
              desc: 给一个订单扣款(订单号 = 幂等键)
              proto: ChargePaymentRequest
              fields:
                - name: order_id
                  type: 整数64
                  required: true
                  desc: 订单号
                  rules:
                    范围: '> 0'
                - name: amount
                  type: 非负十进制
                  required: true
                  desc: 金额
            - type: payment.succeeded
              kind: event
              version: 1
              subject: order_id
              desc: 扣款成功
              proto: PaymentSucceededV1
              fields:
                - name: order_id
                  type: 整数64
                  required: true
                  desc: 订单号
                - name: amount
                  type: 非负十进制
                  required: true
                  desc: 金额
            - type: payment.failed
              kind: event
              version: 1
              subject: order_id
              desc: 扣款失败
              proto: PaymentFailedV1
              fields:
                - name: order_id
                  type: 整数64
                  required: true
                  desc: 订单号
                - name: reason
                  type: 文本
                  desc: 失败的原因
                  rules:
                    长度: 1~200
datasource:
    table: ""
    filters: {}
    columns: []
    sql: ""
behavior:
    - when: 金额 10 万以下
      then: 扣款成功(记录 SUCCEEDED),发出 payment.succeeded
    - when: 金额超过 10 万
      then: 拒绝(记录 FAILED,原因 LIMIT_EXCEEDED),发出 payment.failed
    - when: 同一个订单再来(重投 / 重发,金额可能不同)
      then: 不再扣款,按第一次存下来的结果回答(金额、结果都是第一次的)
