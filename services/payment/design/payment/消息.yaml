# payment 拥有的消息契约: 扣款的命令(payment 执行)+ 扣款结果的事件(payment 发出)
消息:
  payment.charge:
    种类: 命令
    版本: 1
    主体: order_id
    说明: 给一个订单扣款(订单号 = 幂等键)
    字段:
      order_id: { 类型: 整数64,     必填: 是, 范围: "> 0", 说明: 订单号 }
      amount:   { 类型: 非负十进制, 必填: 是, 说明: 金额 }
  payment.succeeded:
    种类: 事件
    版本: 1
    主体: order_id
    说明: 扣款成功
    字段:
      order_id: { 类型: 整数64,     必填: 是, 说明: 订单号 }
      amount:   { 类型: 非负十进制, 必填: 是, 说明: 金额 }
  payment.failed:
    种类: 事件
    版本: 1
    主体: order_id
    说明: 扣款失败
    字段:
      order_id: { 类型: 整数64, 必填: 是, 说明: 订单号 }
      reason:   { 类型: 文本,   必填: 否, 长度: 1~200, 说明: 失败的原因 }
