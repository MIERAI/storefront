spec_version: "0.2"
api:
    rpc: order.order.v1.OrderMessageHandlerService/OrderSaga
    owner: storefront
    risk_level: high
    description: 编排式 saga(storefront 设计 §6)。inventory / payment 通过消息回答,至少投递一次、不保证顺序;命令丢了要重发 (inventory / payment 的处理都是可重入的)。扣款没有撤销的命令,所以 CHARGING 没有期限:支付恢复之前订单一直等, 不能出现"扣了款、订单却取消"。迟到的预留由 inventory 的墓碑挡住,状态机不为迟到的消息做补偿
pattern:
    kind: machine
    not_found_message: ""
    order_by: []
    direction: ""
    page_size:
        default: 0
        max: 0
    command:
        contracts:
            - type: inventory.reserved
              kind: event
              version: 1
              subject: order_id
              desc: 预留成功(全部 SKU)
              proto: InventoryReservedV1
              fields:
                - name: order_id
                  type: 整数64
                  required: true
                  desc: 订单号
                - name: items
                  type: 列表
                  required: true
                  rules:
                    个数: 1~50
                  elem:
                    - name: sku
                      type: 文本
                      required: true
                      rules:
                        格式: 代码
                        长度: 3~32
                    - name: qty
                      type: 整数32
                      required: true
                      rules:
                        范围: 1~1000
                  unique:
                    - sku
            - type: inventory.reservation_failed
              kind: event
              version: 1
              subject: order_id
              desc: 预留失败(一个 SKU 都没有预留)
              proto: InventoryReservationFailedV1
              fields:
                - name: order_id
                  type: 整数64
                  required: true
                  desc: 订单号
                - name: reason
                  type: 文本
                  required: true
                  desc: INSUFFICIENT_STOCK / RELEASED
                  rules:
                    长度: 1~32
            - type: payment.succeeded
              kind: event
              version: 1
              subject: order_id
              desc: 扣款成功
              proto: PaymentSucceededV1
              fields:
                - name: order_id
                  type: 整数64
                  required: true
                  desc: 订单号
                - name: amount
                  type: 非负十进制
                  required: true
                  desc: 金额
            - type: payment.failed
              kind: event
              version: 1
              subject: order_id
              desc: 扣款失败
              proto: PaymentFailedV1
              fields:
                - name: order_id
                  type: 整数64
                  required: true
                  desc: 订单号
                - name: reason
                  type: 文本
                  desc: 失败的原因
                  rules:
                    长度: 1~200
            - type: inventory.committed
              kind: event
              version: 1
              subject: order_id
              desc: 预留已确认(出库)
              proto: InventoryCommittedV1
              fields:
                - name: order_id
                  type: 整数64
                  required: true
                  desc: 订单号
            - type: inventory.released
              kind: event
              version: 1
              subject: order_id
              desc: 预留已释放
              proto: InventoryReleasedV1
              fields:
                - name: order_id
                  type: 整数64
                  required: true
                  desc: 订单号
            - type: inventory.reserve
              kind: command
              version: 1
              subject: order_id
              desc: 为一个订单预留库存(全部 SKU 都够才预留)
              proto: InventoryReserveV1
              fields:
                - name: order_id
                  type: 整数64
                  required: true
                  desc: 订单号
                  rules:
                    范围: '> 0'
                - name: items
                  type: 列表
                  required: true
                  desc: 每个 SKU 预留多少
                  rules:
                    个数: 1~50
                  elem:
                    - name: sku
                      type: 文本
                      required: true
                      rules:
                        格式: 代码
                        长度: 3~32
                    - name: qty
                      type: 整数32
                      required: true
                      rules:
                        范围: 1~1000
                  unique:
                    - sku
            - type: payment.charge
              kind: command
              version: 1
              subject: order_id
              desc: 给一个订单扣款(订单号 = 幂等键)
              proto: PaymentChargeV1
              fields:
                - name: order_id
                  type: 整数64
                  required: true
                  desc: 订单号
                  rules:
                    范围: '> 0'
                - name: amount
                  type: 非负十进制
                  required: true
                  desc: 金额
            - type: inventory.commit
              kind: command
              version: 1
              subject: order_id
              desc: 确认一个订单的预留(支付成功之后)
              proto: InventoryCommitV1
              fields:
                - name: order_id
                  type: 整数64
                  required: true
                  desc: 订单号
                  rules:
                    范围: '> 0'
                - name: items
                  type: 列表
                  required: true
                  rules:
                    个数: 1~50
                  elem:
                    - name: sku
                      type: 文本
                      required: true
                      rules:
                        格式: 代码
                        长度: 3~32
                    - name: qty
                      type: 整数32
                      required: true
                      rules:
                        范围: 1~1000
                  unique:
                    - sku
            - type: inventory.release
              kind: command
              version: 1
              subject: order_id
              desc: 释放一个订单的预留(补偿;预留还没到也要挡住之后迟到的预留)
              proto: InventoryReleaseV1
              fields:
                - name: order_id
                  type: 整数64
                  required: true
                  desc: 订单号
                  rules:
                    范围: '> 0'
                - name: items
                  type: 列表
                  required: true
                  rules:
                    个数: 1~50
                  elem:
                    - name: sku
                      type: 文本
                      required: true
                      rules:
                        格式: 代码
                        长度: 3~32
                    - name: qty
                      type: 整数32
                      required: true
                      rules:
                        范围: 1~1000
                  unique:
                    - sku
            - type: order.cancelled
              kind: event
              version: 1
              subject: order_id
              desc: 订单取消(库存不足 / 支付失败)
              proto: OrderCancelledV1
              fields:
                - name: order_id
                  type: 整数64
                  required: true
                  desc: 订单号
                  rules:
                    范围: '> 0'
                - name: customer_id
                  type: 整数64
                  required: true
                  desc: 客户
                  rules:
                    范围: '> 0'
                - name: reason
                  type: 文本
                  desc: 取消的原因
                  rules:
                    长度: 1~64
            - type: order.confirmed
              kind: event
              version: 1
              subject: order_id
              desc: 订单完成(库存确认、支付成功)
              proto: OrderConfirmedV1
              fields:
                - name: order_id
                  type: 整数64
                  required: true
                  desc: 订单号
                  rules:
                    范围: '> 0'
                - name: customer_id
                  type: 整数64
                  required: true
                  desc: 客户
                  rules:
                    范围: '> 0'
                - name: total
                  type: 非负十进制
                  required: true
                  desc: 订单金额
        machine:
            entity: orders
            state: status
            entered: updated_at
            version: version
            attempts: state_attempts
            created: created_at
            start: PlaceOrder
            states:
                - name: RESERVING
                  command:
                    type: inventory.reserve
                    values:
                        - column: order_id
                          expr: 实体.id
                        - column: items
                          expr: 载入.items
                  timeout: 30
                  every: 60
                  deadline: 900
                  deadline_to: RELEASING
                - name: CHARGING
                  command:
                    type: payment.charge
                    values:
                        - column: order_id
                          expr: 实体.id
                        - column: amount
                          expr: 实体.total
                  timeout: 30
                  every: 60
                - name: CONFIRMING
                  command:
                    type: inventory.commit
                    values:
                        - column: order_id
                          expr: 实体.id
                        - column: items
                          expr: 载入.items
                  timeout: 30
                  every: 60
                - name: RELEASING
                  command:
                    type: inventory.release
                    values:
                        - column: order_id
                          expr: 实体.id
                        - column: items
                          expr: 载入.items
                  timeout: 30
                  every: 60
                - name: CONFIRMED
                  final: true
                - name: CANCELLED
                  final: true
            loads:
                - name: items
                  table: order_items
                  "on":
                    - id = order_id
                  order_by:
                    - line_no asc
                  max: 50
                  columns:
                    - name: sku
                      from: sku
                    - name: qty
                      from: qty
            transitions:
                - from: RESERVING
                  "on": inventory.reserved
                  to: CHARGING
                - from: RESERVING
                  "on": inventory.reservation_failed
                  to: CANCELLED
                  emit:
                    - type: order.cancelled
                      values:
                        - column: order_id
                          expr: 实体.id
                        - column: customer_id
                          expr: 实体.customer_id
                        - column: reason
                          expr: 输入.reason
                - from: CHARGING
                  "on": payment.succeeded
                  guard: 输入.amount = 实体.total
                  to: CONFIRMING
                - from: CHARGING
                  "on": payment.failed
                  to: RELEASING
                - from: CONFIRMING
                  "on": inventory.committed
                  to: CONFIRMED
                  emit:
                    - type: order.confirmed
                      values:
                        - column: order_id
                          expr: 实体.id
                        - column: customer_id
                          expr: 实体.customer_id
                        - column: total
                          expr: 实体.total
                - from: RELEASING
                  "on": inventory.released
                  to: CANCELLED
                  emit:
                    - type: order.cancelled
                      values:
                        - column: order_id
                          expr: 实体.id
                        - column: customer_id
                          expr: 实体.customer_id
                        - column: reason
                          expr: '''COMPENSATED'''
datasource:
    table: ""
    filters: {}
    columns: []
    sql: ""
behavior:
    - when: 库存预留成功
      then: 进入 CHARGING,发出 payment.charge(金额 = 订单金额)
    - when: 库存预留失败(库存不足,或者释放的墓碑先到了)
      then: 进入 CANCELLED,发出 order.cancelled(原因 = inventory 给的原因)
    - when: 扣款成功,金额 = 订单金额
      then: 进入 CONFIRMING,发出 inventory.commit(明细的 SKU 和数量)
    - when: 扣款成功,但金额和订单金额不同
      then: 拒绝(进 DLQ,需要人处理),订单不变
    - when: 扣款失败
      then: 进入 RELEASING,发出 inventory.release
    - when: 库存确认完成
      then: 进入 CONFIRMED(终态),发出 order.confirmed(顾客、金额)
    - when: 库存释放完成
      then: 进入 CANCELLED(终态),发出 order.cancelled(原因 COMPENSATED)
    - when: 等待状态 30 秒没有回答
      then: 重发这个状态的命令,之后每 60 秒一次(订单的 updated_at 不变,state_attempts + 1)
    - when: RESERVING 15 分钟还没有结果(inventory 停机等)
      then: 进入 RELEASING,发出 inventory.release(释放可能已经做了的预留,并留下墓碑挡住迟到的预留)
    - when: CHARGING / CONFIRMING / RELEASING 一直没有回答
      then: 一直重发,没有期限(扣款没有撤销的命令;确认 / 释放是可重入的)
    - when: 重发引起的第二个回答,或者订单已经往前走了之后才到的回答
      then: 忽略(订单不变,不发消息)
    - when: 在这个状态和它之前的状态都不会出现的回答(例如 RESERVING 收到 inventory.committed),或者订单不存在
      then: 拒绝(进 DLQ,说明某处有 bug)
