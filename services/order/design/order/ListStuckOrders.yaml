# ListStuckOrders(Q7): 卡住的订单 —— 在 saga 的等待状态里停留超过 N 分钟(派生参数: 现在 − N 分钟)
API: ListStuckOrders
说明: 返回在等待状态(库存预留 / 支付 / 库存确认 / 库存释放)里停留超过指定分钟数的订单,最后一次状态转移早的在前
背景: saga 的超时监视(J2 的输入)。卡住的订单要重发命令或进入补偿。"现在"是服务器的时钟(请求开始的时刻),
  不由调用方给;测试时由例子的 现在 固定。停留时间从最后一次状态转移(updated_at)算起,正好 N 分钟不算(超过才算)。
  上限 100 件。平时卡住的订单是个位数,超过 100 件说明下游(库存 / 支付)停了,返回错误让人注意,而不是只处理一部分
负责人: storefront
风险: 低

种类: 多条
数据来源: orders

输入:
  stuck_minutes: { 类型: 整数32, 必填: 是, 范围: "1~1440", 说明: 停留超过这个分钟数算卡住 }

派生参数:
  stuck_before: { 计算: 现在 - stuck_minutes 分钟, 筛选: updated_at 小于, 说明: 最后一次状态转移早于这个时刻 }

固定条件:
  - status = 2 或者 status = 3 或者 status = 4 或者 status = 5

输出:
  id:          订单号
  customer_id: 顾客 id
  status:      状态
  total:       合计金额
  created_at:  下单时间
  updated_at:  最后一次状态转移的时间

排序: [updated_at 旧到新, id 小到大]
上限: 100
输出行名: StuckOrder

业务规则:
  - 情况: 卡住的订单超过 100 件
    结果: 返回错误(FAILED_PRECONDITION),不截断(只返回一部分会让超时处理漏掉订单)

例子:
  现在: 2026-11-01 10:00
  准备数据:
    orders:
      - { id: 1, customer_id: 7, status: RESERVING,  total: 1200, created_at: 2026-11-01 09:00, updated_at: 2026-11-01 09:00 }
      - { id: 2, customer_id: 7, status: CHARGING,   total: 800,  created_at: 2026-11-01 09:10, updated_at: 2026-11-01 09:50 }
      - { id: 3, customer_id: 8, status: CONFIRMED,  total: 500,  created_at: 2026-11-01 08:00, updated_at: 2026-11-01 08:05 }
      - { id: 4, customer_id: 8, status: RELEASING,  total: 300,  created_at: 2026-11-01 09:20, updated_at: 2026-11-01 09:30 }
      - { id: 5, customer_id: 9, status: PENDING,    total: 100,  created_at: 2026-11-01 07:00, updated_at: 2026-11-01 07:00 }
      - { id: 6, customer_id: 9, status: CONFIRMING, total: 900,  created_at: 2026-11-01 09:00, updated_at: 2026-11-01 09:00 }
  用例:
    - 说明: 停留超过 30 分钟的等待状态的订单(完成 / 取消 / 还没开始的不算;正好 30 分钟前转移的 4 号不算),最后一次转移早的在前,同时刻按订单号
      输入: { stuck_minutes: 30 }
      结果: { orders: [1, 6] }
    - 说明: 29 分钟的话,30 分钟前转移的订单也算
      输入: { stuck_minutes: 29 }
      结果: { orders: [1, 6, 4] }
    - 说明: 过了一段时间再看,刚才 10 分钟前转移的订单也卡住了
      现在: 2026-11-01 10:30
      输入: { stuck_minutes: 30 }
      结果: { orders: [{ id: 1, status: RESERVING, total: "1200" }, { id: 6 }, { id: 4 }, { id: 2 }] }
    - 说明: 分钟数超出范围
      输入: { stuck_minutes: 0 }
      结果: 参数错误
