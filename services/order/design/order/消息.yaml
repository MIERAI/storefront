# order 拥有的消息契约(事件)。工厂生成 ../../contracts/<type>.v<N>.json;订单的 saga(R5)发出它们,通知服务订阅
消息:
  order.confirmed:
    种类: 事件
    版本: 1
    主体: order_id
    说明: 订单完成(库存确认、支付成功)
    字段:
      order_id:    { 类型: 整数64,   必填: 是, 范围: "> 0", 说明: 订单号 }
      customer_id: { 类型: 整数64,   必填: 是, 范围: "> 0", 说明: 客户 }
      total:       { 类型: 非负十进制, 必填: 是, 说明: 订单金额 }
  order.cancelled:
    种类: 事件
    版本: 1
    主体: order_id
    说明: 订单取消(库存不足 / 支付失败)
    字段:
      order_id:    { 类型: 整数64, 必填: 是, 范围: "> 0", 说明: 订单号 }
      customer_id: { 类型: 整数64, 必填: 是, 范围: "> 0", 说明: 客户 }
      reason:      { 类型: 文本,   必填: 否, 长度: 1~64, 说明: 取消的原因 }
