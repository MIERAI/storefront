# GetOrder(storefront v2 Q5): 订单详情 = 订单 + 明细
API: GetOrder
说明: 返回一个订单和它的明细(按行号)
背景: 订单详情页。明细最多 50 行(下单时限制);超过 50 行的订单是数据的问题,不悄悄截断,整个请求报错
负责人: storefront
风险: 低

种类: 按键取一条
数据来源: orders

嵌套:
  items:
    表: order_items
    条件: [id = order_id]
    排序: [line_no 小到大]
    上限: 50
    列: [line_no, sku, qty, price, amount]

输入:
  id: { 类型: 整数64, 必填: 是, 范围: "> 0", 说明: 订单号, 筛选: id 等于 }

输出:
  id:          订单号
  customer_id: 顾客 ID
  status:      状态
  total:       订单金额
  created_at:  下单时间
  updated_at:  最后更新时间
  items:       明细(按行号;没有明细 = 空列表;超过 50 行时整个请求报错)

找不到时: "order not found: {id}"

例子:
  准备数据:
    orders:
      - { id: 1, customer_id: 7, status: CONFIRMED, total: "3250", created_at: "2026-11-01 09:00", updated_at: "2026-11-01 09:05" }
      - { id: 2, customer_id: 7, status: PENDING,   total: "0",    created_at: "2026-11-02 10:00", updated_at: "2026-11-02 10:00" }
      - { id: 3, customer_id: 8, status: CHARGING,  total: "51",   created_at: "2026-11-03 11:00", updated_at: "2026-11-03 11:00" }
    order_items:
      - { order_id: 1, line_no: 2, sku: "BEAN-002", qty: 1, price: "1250" }
      - { order_id: 1, line_no: 1, sku: "BEAN-001", qty: 2, price: "1000.00" }
      - { order_id: 3, line_no: "1~51", sku: "TEA-001", qty: 1, price: "1", 重复: 51 }
  用例:
    - 说明: 明细按行号返回,金额 = 数量 × 单价(十进制按文本,不丢精度)
      输入: { id: 1 }
      结果:
        id: 1
        customer_id: 7
        status: CONFIRMED
        total: "3250"
        created_at: "2026-11-01 09:00"
        items:
          - { line_no: 1, sku: "BEAN-001", qty: 2, price: "1000.00", amount: "2000.00" }
          - { line_no: 2, sku: "BEAN-002", qty: 1, price: "1250", amount: "1250" }
    - 说明: 没有明细的订单 → 空列表
      输入: { id: 2 }
      结果: { id: 2, status: PENDING, items: [] }
    - 说明: 明细超过 50 行 → 不截断,报错
      输入: { id: 3 }
      结果: 超过上限
    - 说明: 不存在的订单
      输入: { id: 99 }
      结果: 找不到
