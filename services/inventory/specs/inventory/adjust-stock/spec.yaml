spec_version: "0.2"
api:
    rpc: inventory.inventory.v1.InventoryService/AdjustStock
    owner: storefront
    risk_level: medium
    description: 仓库的入库、盘点、报损在管理画面上登记。可售数量绝不能变成负数(超卖);每次调整都要留下记录(谁也不能改了库存却没有记录)。两个人同时调整同一个 SKU 时按调整量累加,不需要版本号
pattern:
    kind: command
    not_found_message: ""
    order_by: []
    direction: ""
    page_size:
        default: 0
        max: 0
    command:
        ops:
            - name: 库存
              kind: update
              table: stock
              key:
                - column: sku
                  expr: 输入.sku
              values:
                - column: available
                  expr: available + 输入.delta
                - column: version
                  expr: version + 1
                - column: updated_at
                  expr: now()
              cond: available + 输入.delta >= 0
              unmet: INSUFFICIENT_STOCK
              not_found: 'stock not found: {sku}'
            - name: 记录
              kind: insert
              table: stock_adjustments
              values:
                - column: sku
                  expr: 库存.sku
                - column: delta
                  expr: 输入.delta
                - column: reason
                  expr: 输入.reason
                - column: adjusted_at
                  expr: now()
        output:
            - field: sku
              op: 库存
              column: sku
            - field: available
              op: 库存
              column: available
            - field: reserved
              op: 库存
              column: reserved
            - field: version
              op: 库存
              column: version
            - field: adjustment_id
              op: 记录
              column: id
            - field: adjusted_at
              op: 记录
              column: adjusted_at
datasource:
    table: ""
    filters: {}
    columns: []
    sql: ""
behavior:
    - when: 调整之后可售数量小于 0(出库 / 报损的数量比现有的多)
      then: 库存不足(FAILED_PRECONDITION,原因码 INSUFFICIENT_STOCK),不调整、不写审计记录
    - when: 调整之后可售数量正好是 0
      then: 调整(可以卖完)
    - when: 调整量是 0(盘点没有差异)
      then: 照样记录(版本号加 1、审计记录一行),盘点做过了也是要留下的事实
    - when: 没有这个 SKU 的库存记录
      then: 找不到(NOT_FOUND),什么都不写。库存记录在商品登记时建立,这个 API 不新建
    - when: 已预留数量
      then: 不变(预留由订单的流程处理,R4)
    - when: 两个人同时调整同一个 SKU
      then: 按调整量依次累加,每一次都检查可售数量不小于 0(不需要版本号)
