spec_version: "0.2"
api:
    rpc: inventory.inventory.v1.InventoryMessageHandlerService/ReserveStock
    owner: storefront
    risk_level: high
    description: 订单的 saga 发命令过来,至少投递一次、不保证顺序。重投只处理一次;同样内容的新命令(saga 的超时重发)不能扣两次;释放先到了(墓碑)就不再预留,回答 RELEASED
pattern:
    kind: message
    not_found_message: ""
    order_by: []
    direction: ""
    page_size:
        default: 0
        max: 0
    command:
        ops:
            - name: 预留
              kind: insert_idempotent
              table: reservations
              values:
                - column: order_id
                  expr: 输入.order_id
                - column: sku
                  expr: 项.sku
                - column: qty
                  expr: 项.qty
                - column: status
                  expr: "1"
              conflict:
                - order_id
                - sku
            - name: 扣减
              kind: update
              table: stock
              key:
                - column: sku
                  expr: 项.sku
              values:
                - column: available
                  expr: available - 项.qty
                - column: reserved
                  expr: reserved + 项.qty
                - column: version
                  expr: version + 1
                - column: updated_at
                  expr: now()
              cond: available >= 项.qty
              unmet: INSUFFICIENT_STOCK
              not_found: stock not found (order {order_id})
              only: 预留.新建
        receive:
            type: inventory.reserve
            version: 1
        each: items
        results:
            - name: RELEASED
              when: 预留.status = 3
              any: true
              emit:
                - type: inventory.reservation_failed
                  values:
                    - column: order_id
                      expr: 输入.order_id
                    - column: reason
                      expr: '''RELEASED'''
            - name: INSUFFICIENT_STOCK
              emit:
                - type: inventory.reservation_failed
                  values:
                    - column: order_id
                      expr: 输入.order_id
                    - column: reason
                      expr: '''INSUFFICIENT_STOCK'''
            - name: 成功
              emit:
                - type: inventory.reserved
                  values:
                    - column: order_id
                      expr: 输入.order_id
                    - column: items
                      expr: 输入.items
        contracts:
            - type: inventory.reserve
              kind: command
              version: 1
              subject: order_id
              desc: 为一个订单预留库存(全部 SKU 都够才预留)
              proto: ReserveStockRequest
              fields:
                - name: order_id
                  type: 整数64
                  required: true
                  desc: 订单号
                  rules:
                    范围: '> 0'
                - name: items
                  type: 列表
                  required: true
                  desc: 每个 SKU 预留多少
                  rules:
                    个数: 1~50
                  elem:
                    - name: sku
                      type: 文本
                      required: true
                      rules:
                        格式: 代码
                        长度: 3~32
                    - name: qty
                      type: 整数32
                      required: true
                      rules:
                        范围: 1~1000
                  unique:
                    - sku
            - type: inventory.reservation_failed
              kind: event
              version: 1
              subject: order_id
              desc: 预留失败(一个 SKU 都没有预留)
              proto: InventoryReservationFailedV1
              fields:
                - name: order_id
                  type: 整数64
                  required: true
                  desc: 订单号
                - name: reason
                  type: 文本
                  required: true
                  desc: INSUFFICIENT_STOCK / RELEASED
                  rules:
                    长度: 1~32
            - type: inventory.reserved
              kind: event
              version: 1
              subject: order_id
              desc: 预留成功(全部 SKU)
              proto: InventoryReservedV1
              fields:
                - name: order_id
                  type: 整数64
                  required: true
                  desc: 订单号
                - name: items
                  type: 列表
                  required: true
                  rules:
                    个数: 1~50
                  elem:
                    - name: sku
                      type: 文本
                      required: true
                      rules:
                        格式: 代码
                        长度: 3~32
                    - name: qty
                      type: 整数32
                      required: true
                      rules:
                        范围: 1~1000
                  unique:
                    - sku
datasource:
    table: ""
    filters: {}
    columns: []
    sql: ""
behavior:
    - when: 每个 SKU 的可售数量都够
      then: 每个 SKU 一条 HELD 的预留(过期时间 = 24 小时后,数据库的默认值),可售减少、已预留增加;发出 inventory.reserved
    - when: 某个 SKU 不够
      then: 一个都不预留(前面的也回滚);发出 inventory.reservation_failed(INSUFFICIENT_STOCK)
    - when: 释放先到了(有 RELEASED 的墓碑)
      then: 不预留;发出 inventory.reservation_failed(RELEASED)
    - when: 同样内容的命令再来(新 id)
      then: 已经预留过的 SKU 不再扣(仅当 预留.新建),照样回答 inventory.reserved
    - when: 没有这个 SKU 的库存记录
      then: 毒消息(进 DLQ,人来处理),什么都不写
