spec_version: "0.2"
api:
    rpc: inventory.inventory.v1.InventoryMessageHandlerService/CommitStock
    owner: storefront
    risk_level: high
    description: 重复的确认不能出库两次。预留已经释放、支付却成功了是不该发生的异常(预留的过期时间远长于 saga 的期限),不能悄悄成功,要人来处理
pattern:
    kind: message
    not_found_message: ""
    order_by: []
    direction: ""
    page_size:
        default: 0
        max: 0
    command:
        ops:
            - name: 确认
              kind: update
              table: reservations
              key:
                - column: order_id
                  expr: 输入.order_id
                - column: sku
                  expr: 项.sku
              values:
                - column: status
                  expr: "2"
              cond: status = 1
              not_found: reservation not found (order {order_id})
              skip: true
            - name: 出库
              kind: update
              table: stock
              key:
                - column: sku
                  expr: 项.sku
              values:
                - column: reserved
                  expr: reserved - 确认.qty
                - column: version
                  expr: version + 1
                - column: updated_at
                  expr: now()
              not_found: stock not found (order {order_id})
              only: 确认.已更新
        receive:
            type: inventory.commit
            version: 1
        each: items
        results:
            - name: ALREADY_RELEASED
              when: 确认.status = 3
              any: true
              dlq: true
            - name: 成功
              emit:
                - type: inventory.committed
                  values:
                    - column: order_id
                      expr: 输入.order_id
        contracts:
            - type: inventory.commit
              kind: command
              version: 1
              subject: order_id
              desc: 确认一个订单的预留(支付成功之后)
              proto: CommitStockRequest
              fields:
                - name: order_id
                  type: 整数64
                  required: true
                  desc: 订单号
                  rules:
                    范围: '> 0'
                - name: items
                  type: 列表
                  required: true
                  rules:
                    个数: 1~50
                  elem:
                    - name: sku
                      type: 文本
                      required: true
                      rules:
                        格式: 代码
                        长度: 3~32
                    - name: qty
                      type: 整数32
                      required: true
                      rules:
                        范围: 1~1000
                  unique:
                    - sku
            - type: inventory.committed
              kind: event
              version: 1
              subject: order_id
              desc: 预留已确认(出库)
              proto: InventoryCommittedV1
              fields:
                - name: order_id
                  type: 整数64
                  required: true
                  desc: 订单号
datasource:
    table: ""
    filters: {}
    columns: []
    sql: ""
behavior:
    - when: 预留是 HELD
      then: 改成 COMMITTED,已预留数量减少预留的数量
    - when: 已经确认过(重发)
      then: 跳过,照样发出 inventory.committed
    - when: 预留已经释放
      then: 不提交,进 DLQ(ALREADY_RELEASED)
    - when: 没有这个预留
      then: 毒消息(DLQ)
