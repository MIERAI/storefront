# inventory 拥有的消息契约: 预留 / 确认 / 释放的命令(inventory 执行)+ 回答的事件(inventory 发出)
消息:
  inventory.reserve:
    种类: 命令
    版本: 1
    主体: order_id
    说明: 为一个订单预留库存(全部 SKU 都够才预留)
    字段:
      order_id: { 类型: 整数64, 必填: 是, 范围: "> 0", 说明: 订单号 }
      items:
        类型: 列表
        必填: 是
        个数: 1~50
        唯一: [sku]
        说明: 每个 SKU 预留多少
        元素:
          sku: { 类型: 文本,   长度: 3~32, 格式: 代码 }
          qty: { 类型: 整数32, 范围: 1~1000 }
  inventory.commit:
    种类: 命令
    版本: 1
    主体: order_id
    说明: 确认一个订单的预留(支付成功之后)
    字段:
      order_id: { 类型: 整数64, 必填: 是, 范围: "> 0", 说明: 订单号 }
      items:
        类型: 列表
        必填: 是
        个数: 1~50
        唯一: [sku]
        元素:
          sku: { 类型: 文本,   长度: 3~32, 格式: 代码 }
          qty: { 类型: 整数32, 范围: 1~1000 }
  inventory.release:
    种类: 命令
    版本: 1
    主体: order_id
    说明: 释放一个订单的预留(补偿;预留还没到也要挡住之后迟到的预留)
    字段:
      order_id: { 类型: 整数64, 必填: 是, 范围: "> 0", 说明: 订单号 }
      items:
        类型: 列表
        必填: 是
        个数: 1~50
        唯一: [sku]
        元素:
          sku: { 类型: 文本,   长度: 3~32, 格式: 代码 }
          qty: { 类型: 整数32, 范围: 1~1000 }
  inventory.reserved:
    种类: 事件
    版本: 1
    主体: order_id
    说明: 预留成功(全部 SKU)
    字段:
      order_id: { 类型: 整数64, 必填: 是, 说明: 订单号 }
      items:
        类型: 列表
        必填: 是
        个数: 1~50
        唯一: [sku]
        元素:
          sku: { 类型: 文本,   长度: 3~32, 格式: 代码 }
          qty: { 类型: 整数32, 范围: 1~1000 }
  inventory.reservation_failed:
    种类: 事件
    版本: 1
    主体: order_id
    说明: 预留失败(一个 SKU 都没有预留)
    字段:
      order_id: { 类型: 整数64, 必填: 是, 说明: 订单号 }
      reason:   { 类型: 文本,   必填: 是, 长度: 1~32, 说明: "INSUFFICIENT_STOCK / RELEASED" }
  inventory.committed:
    种类: 事件
    版本: 1
    主体: order_id
    说明: 预留已确认(出库)
    字段:
      order_id: { 类型: 整数64, 必填: 是, 说明: 订单号 }
  inventory.released:
    种类: 事件
    版本: 1
    主体: order_id
    说明: 预留已释放
    字段:
      order_id: { 类型: 整数64, 必填: 是, 说明: 订单号 }
