# ============================================================================
# InitStock: 收到 catalog.product_created → 为新商品建库存记录(M13;消息处理器: 幂等新建)
# ============================================================================
API: InitStock
说明: 收到新商品的事件,为这个 SKU 建一条库存记录(可用 0、已预留 0)。已经有了就什么都不改
背景: 库存记录在商品登记时建立(AdjustStock 对没有库存记录的 SKU 返回找不到)。事件至少投递一次,重投、重发都不能改已有的库存
负责人: storefront
风险: 低

种类: 消息处理
收到: catalog.product_created

操作:
  - 库存:
      幂等新建: stock
      键: [sku]
      值: { sku: 消息.sku, available: 0, reserved: 0, version: 1, updated_at: 现在 }

结果:
  成功: {}

业务规则:
  - 情况: 这个 SKU 还没有库存记录
    结果: 新建(可用 0、已预留 0)
  - 情况: 已经有了(重投、重发,或者先入过库)
    结果: 不改已有的记录

例子:
  现在: "2026-11-22 10:00"
  准备数据:
    stock:
      - { sku: "BEAN-001", available: 7, reserved: 2, version: 4, updated_at: "2026-11-01 09:00" }
  用例:
    - 说明: 新的 SKU → 库存 0
      消息: { sku: "MUG-004" }
      结果: 成功
      发出: []
      之后:
        stock:
          - { sku: "BEAN-001", available: 7, reserved: 2, version: 4 }
          - { sku: "MUG-004", available: 0, reserved: 0, version: 1, updated_at: "2026-11-22 10:00" }
    - 说明: 已经有库存记录 → 不改
      消息: { sku: "BEAN-001" }
      结果: 成功
      发出: []
      之后: 不变
