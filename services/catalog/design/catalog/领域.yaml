# ============================================================================
# 领域: catalog(storefront v2 的商品服务)
#   这个服务独占的数据库(db/schema/catalog.sql)。写接口在命令工厂(R3)。
# ============================================================================
领域: catalog
说明: 商品和价格
时区: Asia/Tokyo

表:
  products:
    说明: 商品(一个 SKU 一行)
    主键: [sku]
    更新方式: 可以更新
    列:
      sku:        SKU
      name:       商品名
      category:   分类
      price:      售价(十进制)
      status:     { 说明: 状态, 枚举: ProductStatus }
      version:    版本号(乐观锁)
      updated_at: 最后更新时间

枚举:
  ProductStatus:
    说明: 商品的状态
    值:
      ON_SALE:      { 说明: 在售,   数据库值: 1 }
      DISCONTINUED: { 说明: 已下架, 数据库值: 2 }
    读到不认识的值: 返回"未指定",并记录到监控指标
